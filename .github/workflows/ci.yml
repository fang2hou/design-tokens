name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-history:
    name: Validate commit history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Check commit history (cog)
        run: cog check

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Build tokens and site
        run: mise run build
      - name: Run checks
        run: mise run check
