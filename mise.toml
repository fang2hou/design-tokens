[tools]
node = "24.22.0"
pnpm = "12.14.0"
oxlint = "1.88.0"
oxfmt = "0.73.0"
prek = "0.5.5"
cocogitto = "7.0.0"

[tasks.dev]
run = "pnpm dev"
description = "Start the preview site dev server"

[tasks."build:tokens"]
run = "pnpm build:tokens"
description = "Compile DTCG tokens into dist artifacts"

[tasks.build]
run = "pnpm build"
description = "Build tokens and the production site"

[tasks.lint]
run = "pnpm lint"
description = "Lint with oxlint"

[tasks.format]
run = "pnpm format"
description = "Format with oxfmt"

[tasks.format-check]
run = "pnpm format:check"
description = "Check formatting with oxfmt"

[tasks.typecheck]
run = "pnpm typecheck"
description = "Type-check with tsc"

[tasks.check]
depends = ["lint", "format-check", "typecheck"]
description = "Full validation, run before every commit"
